[project]
name = "testbenchdaq"
version = "0.2.0"
description = "Coordinated Gator and enDAQ acquisition for PHM test benches"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "endaq>=1.5,<2",
    "endaq-device>=1.3,<2",
]

[project.scripts]
tbdaq = "tbdaq.__main__:main"

[tool.setuptools.packages.find]
include = ["tbdaq*"]
