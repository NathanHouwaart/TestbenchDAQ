[project]
name = "testbenchdaq"
version = "0.3.0"
description = "Coordinated Gator and enDAQ acquisition for PHM test benches"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "endaq>=1.5,<2",
    "endaq-device>=1.3,<2",
]

[project.optional-dependencies]
plotting = ["plotly>=5,<7"]
service = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.scripts]
tbdaq = "tbdaq.__main__:main"

[tool.setuptools.packages.find]
include = ["tbdaq*"]
