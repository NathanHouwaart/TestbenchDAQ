services:
  # Standalone development preview only. Production deployment belongs in the
  # ML-Machine-Gateway Compose stack, where Nginx serves /data/.
  portal-api:
    build:
      context: .
      dockerfile: portal/api/Dockerfile
    restart: unless-stopped
    volumes:
      - /srv/testbenchdaq:/data:ro
    networks: [portal]

  processor:
    build:
      context: .
      dockerfile: portal/processor/Dockerfile
    restart: unless-stopped
    volumes:
      - /srv/testbenchdaq:/data
    networks: [portal]

  portal-web:
    build:
      context: .
      dockerfile: portal/web/Dockerfile
    depends_on: [portal-api]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./portal/auth:/etc/nginx/auth:ro
    networks: [portal]

networks:
  portal:
    driver: bridge
